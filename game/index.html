<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#05080f">
  <title>Qui parle ?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Klee+One:wght@400;600&family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- スマホを縦向きにしているときだけ出す案内 -->
  <div id="rotate">
    <div class="rotate-icon">📱</div>
    <p>端末を横向きにしてください</p>
    <p>Tournez votre appareil à l'horizontale</p>
    <p>Please rotate your device to landscape</p>
  </div>
  <div id="game" data-phase="0">
    <div id="scene">
      <div id="backdrop"></div>
      <div id="view">
        <div id="bg"><div id="bg-label"></div><div id="bg-note"></div></div>
        <div id="hotspots"></div>
        <div id="char" hidden></div>
      </div>
    </div>
    <div id="card" hidden></div>
    <aside id="ai-panel" hidden>
      <div class="ai-head"><span class="ai-dot"></span><span id="ai-title"></span></div>
      <div id="bio"></div>
      <div id="synth"></div>
      <div id="stream" hidden></div>
      <div id="ai-log"></div>
    </aside>
    <header id="hud">
      <div id="phase-label"></div>
      <div id="gauge" hidden>
        <span id="gauge-label"></span>
        <div class="bar"><div id="gauge-fill"></div></div>
        <span id="gauge-val"></span>
      </div>
      <button id="btn-notebook" hidden></button>
      <button id="btn-sound"></button>
      <div id="langs">
        <button data-lang="ja">日本語</button><button data-lang="fr">FR</button><button data-lang="en">EN</button>
      </div>
    </header>
    <div id="nav" hidden>
      <button id="arrow-left" aria-label="left">◀</button>
      <span id="dir-label"></span>
      <button id="arrow-right" aria-label="right">▶</button>
    </div>
    <div id="choices" hidden></div>
    <div id="cine"></div>
    <div id="textbox" hidden><div id="speaker"></div><div id="text"></div><div id="next">▼</div></div>
    <div id="overlay" hidden></div>
    <div id="debug" hidden></div>
  </div>

  <script src="js/script-data.js"></script>
  <script src="js/data.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
